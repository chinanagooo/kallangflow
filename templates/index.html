<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KallangFlow</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
    background: #fafaf8;
  }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  p.sub { color: #6b6b68; font-size: 14px; margin-top: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .node-card {
    background: #f1efe8;
    border-radius: 8px;
    padding: 16px;
  }
  .node-card .name { font-size: 13px; color: #6b6b68; margin: 0 0 4px; }
  .node-card .load { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 6px;
    display: inline-block;
  }
  .badge.high { background: #fcebeb; color: #791f1f; }
  .badge.moderate { background: #faeeda; color: #633806; }
  .badge.low { background: #eaf3de; color: #27500a; }
  .card {
    background: #fff;
    border: 1px solid #e3e1d8;
    border-radius: 12px;
    padding: 16px 20px;
  }
  .attendee-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #e6f1fb; color: #0c447c;
    display: flex; align-items: center; justify-content: center;
    font-weight: 500; font-size: 13px;
  }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d3d1c7;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f1efe8; }
  button:disabled { opacity: 0.6; cursor: default; }
  #result {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #e3e1d8;
    font-size: 14px;
  }
  #result.error { color: #791f1f; }
  .note { font-size: 12px; color: #9a988e; margin-top: 12px; }
</style>
</head>
<body>

<h1>KallangFlow</h1>
<p class="sub">Simulated crowd-flow data, real Bedrock-powered recommendations.</p>

<div class="grid" id="node-grid">
  <!-- populated by JS from /api/world -->
</div>

<div class="card">
  <div class="attendee-row">
    <div class="avatar">AT</div>
    <div>
      <p style="font-weight: 500; margin: 0; font-size: 15px;">Attendee A-DEMO</p>
      <p style="font-size: 13px; color: #6b6b68; margin: 0;">Home: Tampines &middot; prefers MRT</p>
    </div>
  </div>
  <button id="plan-btn" onclick="planJourney()">Plan my journey</button>
  <div id="result"></div>
</div>

<p class="note">Node loads refresh from <code>/api/world</code>. The recommendation comes from a real LangGraph agent call to Amazon Bedrock via <code>/api/plan</code> — expect a few seconds while it runs.</p>

<script>
async function loadWorld() {
  const grid = document.getElementById('node-grid');
  try {
    const res = await fetch('/api/world');
    const nodes = await res.json();
    grid.innerHTML = '';
    for (const [id, node] of Object.entries(nodes)) {
      const pct = Math.round((node.load / node.capacity) * 100);
      const card = document.createElement('div');
      card.className = 'node-card';
      card.innerHTML = `
        <p class="name">${node.name}</p>
        <p class="load">${pct}%</p>
        <span class="badge ${node.congestion}">${node.congestion}</span>
      `;
      grid.appendChild(card);
    }
  } catch (err) {
    grid.innerHTML = '<p style="color:#791f1f;">Could not load node data.</p>';
  }
}

async function planJourney() {
  const btn = document.getElementById('plan-btn');
  const result = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = 'Thinking…';
  result.style.display = 'none';
  result.classList.remove('error');

  try {
    const res = await fetch('/api/plan', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      result.textContent = 'Something went wrong: ' + data.error;
      result.classList.add('error');
    } else {
      result.textContent = data.recommendation;
    }
    result.style.display = 'block';
  } catch (err) {
    result.textContent = 'Could not reach the server.';
    result.classList.add('error');
    result.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Plan my journey';
  }
}

loadWorld();
</script>

</body>
</html>
